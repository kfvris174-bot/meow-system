  --bg-photo-url: var(--bg-default-url);

  --tone-overdue-bg: #f2c5c9;
  --tone-overdue-ink: #7b1928;
  --tone-today-bg: #f2d79f;
  --tone-today-ink: #684506;
  --tone-soon-bg: #dce5bd;
  --tone-soon-ink: #3f5220;
  --tone-later-bg: #e9e0cf;
  --tone-later-ink: #5d584b;
  --tone-plan-bg: #dfd4ee;
  --tone-plan-ink: #49376a;


  --status-bg: #0a0f26;
  --status-ink: #f2e8d4;
  --status-soft: #8790b8;
  --tab-bg: rgba(251, 244, 229, 0.82);
  --tab-line: rgba(27, 33, 66, 0.16);

  /* 背景照片上的毛玻璃层：--glass 给卡片，--glass-soft 给输入框/标签等小控件，
     --glass-strong 给必须压住内容的弹窗面板与底栏 */
  --glass: rgba(251, 244, 229, 0.82);
  --glass-soft: rgba(251, 244, 229, 0.72);
  --glass-strong: rgba(251, 244, 229, 0.92);
  --glass-blur: 18px;
  /* 照片整体压一层薄纱 + 轻微虚化，保证直接压在照片上的标题也能读 */
  --photo-veil: rgba(251, 244, 229, 0.44);
  --photo-blur: 2px;

  --chrome: linear-gradient(135deg,
      #ffffff 0%,
      #dfe5f4 12%,
      #94a1c2 27%,
      #5c688d 40%,
      #f7f9ff 51%,
      #a9b5d3 63%,
      #eef2fd 72%,
      #5a668b 88%,
      #c3cce2 100%);

  --rainbow: repeating-linear-gradient(90deg,
      #b23a4b 0 6px,
      #d18047 6px 12px,
      #d7bf5d 12px 18px,
      #6d9870 18px 24px,
      #405fd6 24px 30px,
      #8c6ab4 30px 36px);

  --radius: 22px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
}

html {
  background: #070b1a;
}

body {
  margin: 0;
  min-height: 100dvh;
  overflow: hidden;
  font-family: var(--font-ui);
  background: #070b1a;
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 22px;
  overscroll-behavior: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible,
[role="button"]:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--blue-2);
  outline-offset: 2px;
}

h1, h2, h3, h4, p {
  margin: 0;
}

ul, ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

svg {
  display: block;
}

::selection {
  background: var(--blue);
  color: var(--on-accent);
}

/* ---------- desktop moodboard ---------- */

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 45%, rgba(35, 53, 125, 0.24), transparent 45%),
    #070b1a;
  z-index: 0;
}

.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.34) 0 1px, transparent 1px 4px);
  opacity: 0.65;
}

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.08) 0.7px, transparent 0.8px);
  background-size: 5px 5px;
  opacity: 0.35;
  mix-blend-mode: screen;
}

.scene-rainbow {
  position: absolute;
  top: -12%;
  left: 4%;
  width: 180px;
  height: 126%;
  background: var(--rainbow);
  opacity: 0.66;
  transform: rotate(7deg);
  filter: saturate(0.9);
}

.scene-rainbow.second {
  left: auto;
  right: 2%;
  width: 76px;
  opacity: 0.32;
  transform: rotate(-4deg);
}

.scene-star {
  position: absolute;
  width: 70px;
  height: 70px;
  background: var(--chrome);
  clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.scene-star.s1 { left: 12%; top: 13%; width: 96px; height: 96px; transform: rotate(11deg); }
.scene-star.s2 { right: 10%; top: 9%; width: 68px; height: 68px; transform: rotate(-18deg); }
.scene-star.s3 { left: 17%; bottom: 15%; width: 52px; height: 52px; transform: rotate(25deg); opacity: 0.9; }
.scene-star.s4 { right: 17%; bottom: 22%; width: 110px; height: 110px; transform: rotate(8deg); opacity: 0.82; }

.scene-bubble {
  position: absolute;
  left: 8%;
  top: 30%;
  width: 230px;
  padding: 18px 20px;
  background: #fbf4e5;
  color: var(--blue-ink);
  border: 1px solid #0a0f26;
  border-radius: 4px;
  transform: rotate(-6deg);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.04em;
}

.scene-bubble::after {
  content: "";
  position: absolute;
  right: 28px;
  bottom: -18px;
  width: 30px;
  height: 30px;
  background: #fbf4e5;
  border-right: 1px solid #0a0f26;
  border-bottom: 1px solid #0a0f26;
  transform: rotate(45deg);
}

.scene-bubble small {
  display: block;
  margin-bottom: 7px;
  color: #b23a4b;
  font-size: 9px;
  letter-spacing: 0.18em;
}

.scene-system {
  position: absolute;
  right: 7%;
  bottom: 10%;
  width: 242px;
  padding: 16px;
  background: var(--blue);
  border: 1px solid #e9dfcb;
  color: var(--on-accent);
  transform: rotate(3deg);
  font-family: var(--font-mono);
  overflow: hidden;
}

.scene-system::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px);
}

.scene-system > * {
  position: relative;
}

.scene-system .sys-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: color-mix(in srgb, var(--on-accent) 76%, transparent);
}

.scene-system strong {
  display: block;
  margin-top: 10px;
  font-family: var(--font-ui);
  font-size: 26px;
  letter-spacing: -0.07em;
}

.scene-system p {
  margin-top: 4px;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--on-accent) 84%, transparent);
}

.scene-cat {
  position: absolute;
  right: 8%;
  top: 30%;
  width: 126px;
  height: 126px;
  padding: 9px;
  background: var(--blue);
  border: 1px solid #f1e7d5;
  transform: rotate(7deg);
  overflow: hidden;
}

.scene-cat::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
}

.scene-cat svg {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.scene-label {
  position: absolute;
  left: 11%;
  bottom: 11%;
  color: #8d95ba;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.28em;
  writing-mode: vertical-rl;
}

.scene-note {
  position: absolute;
  left: 7%;
  top: 8%;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #cfd5ee;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.scene-note::before {
  content: "";
  width: 30px;
  height: 4px;
  background: var(--rainbow);
}

/* ---------- phone shell ---------- */

.phone-shell {
  position: relative;
  z-index: 2;
  width: min(430px, calc(100vw - 32px));
  height: min(920px, calc(100dvh - 44px));
  border-radius: 42px;
  background: var(--bg);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.22);
  isolation: isolate;
}

.phone-screen {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* 背景照片：绝对定位在手机屏内，不随 .screen 滚动而移动 */
.bg-photo {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-color: var(--bg);
  background-image: var(--bg-photo-url);
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  pointer-events: none;
  /* 照片细节太密，轻微虚化 + 降饱和，正文压在上面才读得清 */
  filter: blur(var(--photo-blur)) saturate(0.82);
  transform: scale(1.02);
}

/* 薄纱：压低照片对比度，让直接压在照片上的大标题也能读 */
.bg-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--photo-veil);
}

.phone-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 90;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

/* ---------- system bar ---------- */

.statusbar {
  position: relative;
  z-index: 30;
  flex: none;
  height: 31px;
  padding: 0 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--status-bg);
  color: var(--status-ink);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  overflow: hidden;
}

.statusbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.35) 0 1px, transparent 1px 3px);
  opacity: 0.55;
  pointer-events: none;
}

.statusbar > * {
  position: relative;
  z-index: 1;
}

.sb-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 78px;
}

.sb-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  min-width: 78px;
}

.sb-center {
  color: #cfd5f2;
  font-size: 8px;
  letter-spacing: 0.24em;
  white-space: nowrap;
}

.sb-signal {
  display: flex;
  align-items: flex-end;
  gap: 1.5px;
  height: 9px;
}

.sb-signal i {
  display: block;
  width: 2px;
  background: currentColor;
  border-radius: 1px;
}

.sb-signal i:nth-child(1) { height: 4px; }
.sb-signal i:nth-child(2) { height: 6px; }
.sb-signal i:nth-child(3) { height: 8px; }
.sb-signal i:nth-child(4) { height: 9px; opacity: 0.35; }

.sb-battery {
  position: relative;
  width: 19px;
  height: 9px;
  border: 1px solid currentColor;
  border-radius: 2px;
  padding: 1px;
}

.sb-battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 2px;
  width: 2px;
  height: 3px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}

.sb-battery i {
  display: block;
  width: 74%;
  height: 100%;
  background: currentColor;
  border-radius: 1px;
}

.rainbow-rule {
  flex: none;
  height: 4px;
  background: var(--rainbow);
  position: relative;
  z-index: 29;
  border-bottom: 1px solid rgba(0, 0, 0, 0.45);
}

/* ---------- app + screens ---------- */

#app {
  position: relative;
  z-index: 2;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 17px 16px calc(26px + var(--safe-bottom));
  background: transparent;
  position: relative;
  z-index: 1;
}

.screen::-webkit-scrollbar {
  display: none;
}

.screen.enter {
  animation: screenIn 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- common type ---------- */

.micro {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.2;
}

.micro.blue { color: var(--blue-ink); }
.micro.red { color: var(--red); }
.micro.light { color: rgba(255, 250, 240, 0.7); }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 2px 13px;
}

.page-head h1 {
  margin-top: 7px;
  font-size: 31px;
  line-height: 1.02;
  letter-spacing: -0.07em;
  font-weight: 900;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.eyebrow::before {
  content: "";
  width: 6px;
  height: 6px;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  background: var(--red);
  flex: none;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  padding-top: 1px;
}

.round-btn {
  width: 38px;
  height: 38px;
  flex: none;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  background: var(--glass-strong);
  color: var(--ink);
  position: relative;
  transition: transform 0.15s ease;
}

.round-btn:active {
  transform: translate(2px, 2px);
}

.round-btn.small {
  width: 31px;
  height: 31px;
  border-width: 1px;
}

.head-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  display: grid;
  place-items: center;
  border-radius: 99px;
  background: var(--red);
  color: #fff;
  border: 1px solid var(--paper);
  font-family: var(--font-mono);
  font-size: 7px;
  font-weight: 800;
  line-height: 1;
}

.round-btn.blue {
  background: var(--blue);
  color: var(--on-accent);
  border-color: var(--blue-deep);
}

.round-btn.ghost {
  background: transparent;
  border-color: transparent;
}

.icon-btn {
  width: 32px;
  height: 32px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background: var(--glass-strong);
  color: var(--ink-2);
  transition: transform 0.12s ease, background 0.12s ease;
}

.icon-btn:active {
  transform: scale(0.93);
}

.icon-btn.danger {
  color: var(--red);
}

.icon-btn.plain {
  border-color: transparent;
  background: transparent;
}

.icon-btn.green {
  color: var(--green);
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin: 19px 2px 9px;
}

.section-head h2 {
  font-size: 18px;
  line-height: 1.1;
  letter-spacing: -0.045em;
  font-weight: 850;
  margin-top: 3px;
}

.section-head .head-copy {
  min-width: 0;
}

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: none;
  padding: 5px 0;
  color: var(--blue-ink);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.link-btn:active {
  opacity: 0.55;
}

.paper-card {
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  position: relative;
}

/* ---------- collage banner ---------- */

.collage-banner {
  position: relative;
  min-height: 138px;
  margin: 2px 0 14px;
  padding: 17px;
  border: 1px solid rgba(255, 250, 240, 0.18);
  border-radius: 24px 28px 20px 25px;
  background: #0b1027;
  color: #f7edda;
  overflow: hidden;
  isolation: isolate;
}

.collage-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px);
  opacity: 0.75;
  pointer-events: none;
  z-index: 2;
}

.collage-banner::after {
  content: "";
  position: absolute;
  width: 72px;
  height: 72px;
  right: 22px;
  bottom: -36px;
  background: var(--chrome);
  clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  opacity: 0.9;
  z-index: 1;
}

.banner-rainbow {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 48px;
  background: var(--rainbow);
  opacity: 0.78;
  border-right: 1px solid rgba(255, 255, 255, 0.24);
  z-index: 1;
}

.banner-bubble {
  position: absolute;
  left: 61px;
  top: 16px;
  z-index: 4;
  width: 212px;
  padding: 13px 13px 14px;
  background: #fbf4e5;
  color: var(--blue-ink);
  border: 1px solid #0b1027;
  border-radius: 7px 8px 8px 2px;
  transform: rotate(-1.8deg);
}

.banner-bubble::after {
  content: "";
  position: absolute;
  left: 18px;
  bottom: -8px;
  width: 13px;
  height: 13px;
  background: #fbf4e5;
  border-right: 1px solid #0b1027;
  border-bottom: 1px solid #0b1027;
  transform: rotate(45deg);
}

.banner-bubble strong {
  display: block;
  margin: 0;
  font-size: 23px;
  line-height: 1.18;
  letter-spacing: -0.045em;
  font-weight: 900;
}

.banner-cat {
  position: absolute;
  right: 17px;
  top: 18px;
  width: 80px;
  height: 80px;
  z-index: 3;
  padding: 7px;
  background: var(--blue);
  border: 1px solid #f2e8d4;
  transform: rotate(4deg);
  overflow: hidden;
}

.banner-cat::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    conic-gradient(rgba(255, 255, 255, 0.16) 25%, transparent 0 50%, rgba(255, 255, 255, 0.16) 0 75%, transparent 0) 0 0 / 12px 12px;
  opacity: 0.55;
}

.banner-cat svg {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 1;
  image-rendering: pixelated;
}

.banner-star {
  position: absolute;
  right: 70px;
  top: 7px;
  width: 31px;
  height: 31px;
  z-index: 5;
  background: var(--chrome);
  clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  transform: rotate(12deg);
}

.banner-meta {
  position: absolute;
  left: 61px;
  bottom: 13px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #b7c0e7;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.banner-meta .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #d7bf5d;
}

/* ---------- cat switcher ---------- */

.cat-switcher {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 2px 10px;
  margin: 0 -2px;
  scrollbar-width: none;
}

.cat-switcher::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 4px 12px 4px 4px;
  background: var(--glass-strong);
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -0.02em;
  transition: transform 0.15s ease, background 0.15s ease;
}

.cat-chip:active {
  transform: translate(1px, 1px);
}

.cat-chip.active {
  background: var(--blue);
  border-color: var(--blue-deep);
  color: var(--on-accent);
}

.cat-chip .avatar {
  width: 30px !important;
  height: 30px !important;
  border-radius: 50% !important;
  border-width: 1px;
}

.cat-chip.add {
  padding: 4px 13px;
  color: var(--blue-ink);
  border-style: dashed;
  background: transparent;
}

.cat-chip .chip-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
}

/* ---------- avatars + pixel cat ---------- */

.avatar {
  --size: 48px;
  width: var(--size);
  height: var(--size);
  flex: none;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: calc(var(--size) * 0.28);
  background: var(--blue);
  overflow: hidden;
  position: relative;
}

.avatar::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    conic-gradient(rgba(255, 255, 255, 0.15) 25%, transparent 0 50%, rgba(255, 255, 255, 0.15) 0 75%, transparent 0) 0 0 / 12px 12px;
  opacity: 0.65;
}

.avatar.pixel-2 { background: #b95c71; }
.avatar.pixel-3 { background: #6e9065; }

.avatar svg {
  position: relative;
  z-index: 1;
  width: 88%;
  height: 88%;
  image-rendering: pixelated;
}

.avatar.emoji {
  background: var(--paper-2);
  font-size: calc(var(--size) * 0.55);
  line-height: 1;
}

.avatar.emoji::before {
  display: none;
}

.avatar.lg {
  --size: 78px;
  border-radius: 22px;
  border-width: 1px;
}

.avatar.xl {
  --size: 92px;
  border-radius: 26px;
  border-width: 1px;
}

/* ---------- cat hero card ---------- */

.home-card {
  margin-bottom: 16px;
  overflow: hidden;
}

.home-card .cat-hero.paper-card,
.home-card .module-grid {
  background: transparent;
  border: none;
  border-radius: 0;
}

.home-card .cat-hero {
  margin-bottom: 0;
  padding: 15px 15px 13px;
  overflow: visible;
}

.home-card .cat-hero::after {
  display: none;
}

.home-card .module-grid {
  margin: 0;
  border-top: 1px solid var(--line-soft);
  overflow: hidden;
}

.cat-hero {
  padding: 15px;
  margin-bottom: 13px;
  overflow: hidden;
}

.cat-hero::after {
  content: "";
  position: absolute;
  right: -26px;
  top: -30px;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(30, 59, 219, 0.17) 1px, transparent 1.4px) 0 0 / 6px 6px;
  pointer-events: none;
}

.cat-hero-top {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.cat-id {
  flex: 1;
  min-width: 0;
  padding-right: 0;
}

.cat-id h2 {
  margin-top: 2px;
  font-size: 25px;
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: -0.06em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cat-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.cat-name-row h2 {
  flex: 0 1 auto;
  min-width: 0;
}

.cat-id .micro {
  color: var(--ink-3);
}

.tag-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 7px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  background: var(--glass-soft);
  color: var(--ink-2);
  font-size: 9px;
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: 0.01em;
}

.tag.blue {
  background: var(--blue);
  border-color: var(--blue-deep);
  color: var(--on-accent);
}

.tag.red {
  background: var(--red);
  border-color: #7b1928;
  color: #fff;
}

.tag.green {
  background: var(--green);
  border-color: #365a3e;
  color: #fff;
}

.tag.weight {
  background: transparent;
  border-color: var(--line-soft);
  color: var(--ink-2);
  font-weight: 750;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  margin-left: auto;
  position: relative;
  z-index: 1;
}

.hero-full-link {
  gap: 1px;
  padding: 4px 7px 4px 8px;
  font-size: 10.5px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: var(--glass-strong);
  white-space: nowrap;
}

.cat-hero .edit-corner {
  position: static;
  right: auto;
  top: auto;
}

.cat-hero .tag-row {
  flex-wrap: nowrap;
  overflow: hidden;
}

.cat-hero .tag {
  flex: none;
}

/* ---------- quick modules ---------- */

.module-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  margin: 0 0 5px;
  /* 外框（home-card / 档案页摘要卡）已经做了毛玻璃，这里透明，避免叠两层发灰 */
  background: transparent;
  border: 1px solid var(--line-soft);
  border-radius: 17px;
  overflow: hidden;
}

.module-tile {
  position: relative;
  min-height: 0;
  padding: 9px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: visible;
  transition: background 0.15s ease;
  cursor: pointer;
}

.module-tile + .module-tile {
  border-left: 1px solid var(--line-soft);
}

.module-tile:active {
  background: var(--paper-2);
}

.module-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.module-row strong {
  margin: 0;
  font-size: 14px;
  line-height: 1.05;
  letter-spacing: -0.04em;
  font-weight: 850;
  white-space: nowrap;
}

.module-icon {
  flex: none;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--blue);
  color: var(--on-accent);
}

.module-tile.vaccine .module-icon { background: var(--red); }
.module-tile.neuter .module-icon { background: var(--green); }

.module-tile .module-due {
  display: inline-block;
  margin-top: 0;
  align-self: center;
  text-align: center;
  max-width: 100%;
  padding: 3px 5px;
  border-radius: 5px;
  background: var(--glass-soft);
  border: 1px solid var(--line-soft);
  color: var(--ink-2);
  font-size: 9px;
  line-height: 1.25;
  font-weight: 750;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.module-due.overdue { background: var(--tone-overdue-bg); color: var(--tone-overdue-ink); border-color: transparent; }
.module-due.today { background: var(--tone-today-bg); color: var(--tone-today-ink); border-color: transparent; }
.module-due.soon { background: var(--tone-soon-bg); color: var(--tone-soon-ink); border-color: transparent; }
.module-due.later { background: var(--tone-later-bg); color: var(--tone-later-ink); border-color: transparent; }
.module-due.plan { background: var(--tone-plan-bg); color: var(--tone-plan-ink); border-color: transparent; }

.module-add {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  background: var(--glass-strong);
  color: var(--ink-2);
  opacity: 0.8;
  z-index: 2;
  transition: transform 0.12s ease;
}

.module-add:active {
  transform: scale(0.88);
}

/* ---------- due list ---------- */

.due-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.due-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-left: 1px solid var(--line-soft);
  border-radius: 13px;
}

.due-card.overdue { border-left-color: var(--red); }
.due-card.today { border-left-color: var(--gold); }
.due-card.soon { border-left-color: var(--green); }
.due-card.later { border-left-color: var(--lav); }

.due-card .mini-icon {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--glass-soft);
  color: var(--ink-2);
}

.due-card .due-copy {
  flex: 1;
  min-width: 0;
}

.due-card .due-copy strong {
  display: block;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.due-card .due-copy span {
  display: block;
  margin-top: 2px;
  font-size: 9.5px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.due-badge {
  flex: none;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 9px;
  line-height: 1.2;
  font-weight: 800;
  color: var(--ink-2);
  background: var(--glass-soft);
  border: 1px solid var(--line-soft);
}

.due-badge.overdue { background: var(--tone-overdue-bg); color: var(--tone-overdue-ink); border-color: transparent; }
.due-badge.today { background: var(--tone-today-bg); color: var(--tone-today-ink); border-color: transparent; }
.due-badge.soon { background: var(--tone-soon-bg); color: var(--tone-soon-ink); border-color: transparent; }
.due-badge.later { background: var(--tone-later-bg); color: var(--tone-later-ink); border-color: transparent; }
.due-badge.plan { background: var(--tone-plan-bg); color: var(--tone-plan-ink); border-color: transparent; }

.btn-complete {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 6px 8px;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--blue);
  color: var(--on-accent);
  font-size: 9px;
  line-height: 1.2;
  font-weight: 800;
}

.btn-complete:active {
  transform: translate(1px, 1px);
}

.btn-complete.ghost {
  background: transparent;
  color: var(--blue-ink);
  border-color: var(--line-soft);
}

/* ---------- timeline / recent ---------- */

/* ---------- event log ---------- */

.head-actions-inline {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: none;
}

.head-actions-inline .link-btn {
  white-space: nowrap;
}

.event-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.event-row {
  padding: 9px 10px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-left: 1px solid var(--line-soft);
  border-radius: 4px 10px 10px 4px;
}

.event-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.event-date {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}

.event-row .icon-btn.tiny {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-3);
}

.event-title {
  margin-top: 1px;
  font-size: 12.5px;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  word-break: break-word;
}

.event-text {
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--ink-2);
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}

.event-list.all .event-row {
  padding: 10px 11px;
}

.timeline {
  position: relative;
  padding-left: 17px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 7px;
  bottom: 9px;
  width: 1px;
  background: var(--line-soft);
}

.timeline-item {
  position: relative;
  padding: 0 0 13px 2px;
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--line-soft);
  background: var(--blue);
}

.timeline-item.vaccine::before { background: var(--red); }
.timeline-item.neuter::before { background: var(--green); }

.timeline-item .t-date {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}

.timeline-item .t-title {
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
}

.timeline-item .t-meta {
  margin-top: 2px;
  font-size: 10px;
  color: var(--ink-3);
  line-height: 1.35;
}

/* ---------- empty states ---------- */

.empty {
  padding: 24px 18px;
  text-align: center;
  border: 1px dashed var(--line-soft);
  border-radius: 18px;
  background: var(--glass-soft);
}

.empty .empty-art {
  width: 74px;
  height: 74px;
  margin: 0 auto 10px;
  padding: 6px;
  background: var(--blue);
  border: 1px solid var(--line-soft);
  transform: rotate(-3deg);
}

.empty .empty-art svg {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.empty strong {
  display: block;
  font-size: 14px;
  letter-spacing: -0.03em;
}

.empty p {
  max-width: 240px;
  margin: 5px auto 0;
  font-size: 10.5px;
  line-height: 1.55;
  color: var(--ink-3);
}

.empty .btn {
  margin-top: 12px;
}

/* ---------- buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 9px 14px;
  border: 1px solid var(--line-soft);
  border-radius: 11px;
  background: var(--glass-soft);
  color: var(--ink);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: -0.01em;
  transition: transform 0.13s ease;
}

.btn:active {
  transform: translate(2px, 2px);
}

.btn.primary {
  background: var(--blue);
  border-color: var(--blue-deep);
  color: var(--on-accent);
}

.btn.red {
  background: var(--red);
  border-color: #7b1928;
  color: #fff;
}

.btn.ghost {
  background: transparent;
}

.btn.small {
  min-height: 32px;
  padding: 6px 10px;
  font-size: 10.5px;
  border-width: 1px;
}

.btn.block {
  width: 100%;
}

/* ---------- tab bar ---------- */

.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  padding: 7px 14px calc(8px + var(--safe-bottom));
  background: var(--tab-bg);
  border-top: 1px solid var(--line-soft);
  backdrop-filter: blur(18px) saturate(1.5);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  position: relative;
  z-index: 15;
}

.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 5px 3px 4px;
  border-radius: 12px;
  color: var(--ink-3);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.02em;
  transition: color 0.15s ease, background 0.15s ease;
}

.tab svg {
  width: 21px;
  height: 21px;
}

.tab.active {
  color: var(--blue-ink);
  background: color-mix(in srgb, var(--blue) 10%, transparent);
}

.tab.active::after {
  content: "";
  position: absolute;
  bottom: 1px;
  width: 14px;
  height: 2px;
  border-radius: 99px;
  background: var(--blue);
}

.tab .tab-badge {
  position: absolute;
  top: 2px;
  left: calc(50% + 7px);
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  display: grid;
  place-items: center;
  border-radius: 99px;
  background: var(--red);
  color: #fff;
  border: 1px solid var(--paper);
  font-family: var(--font-mono);
  font-size: 8px;
  line-height: 1;
}

/* ---------- reminders tab ---------- */

.filter-chips {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  margin: 0 -2px;
  scrollbar-width: none;
}

.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
  flex: none;
  padding: 7px 11px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: var(--glass-soft);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 800;
}

.filter-chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.reminder-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  margin-bottom: 6px;
  background: #0b1027;
  color: #f6ecd9;
  border: 1px solid rgba(255, 250, 240, 0.18);
  border-radius: 19px;
  overflow: hidden;
  position: relative;
}

.reminder-summary::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.26) 0 1px, transparent 1px 3px);
  opacity: 0.8;
}

.reminder-summary::after {
  content: "";
  position: absolute;
  right: -19px;
  top: -19px;
  width: 68px;
  height: 68px;
  background: var(--chrome);
  clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.reminder-summary > * {
  position: relative;
  z-index: 1;
}

.reminder-summary .rs-copy {
  flex: 1;
}

.reminder-summary .rs-copy strong {
  display: block;
  margin-top: 3px;
  font-size: 21px;
  letter-spacing: -0.05em;
  line-height: 1.1;
}

.reminder-summary .rs-copy span {
  display: block;
  margin-top: 3px;
  color: #afb8df;
  font-size: 9.5px;
}

.reminder-summary .rs-count {
  font-family: var(--font-mono);
  font-size: 34px;
  line-height: 1;
  letter-spacing: -0.08em;
  color: #fff;
}

.reminder-group {
  margin-top: 15px;
}

.reminder-group-title {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 2px 7px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.reminder-group-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-soft);
}

.reminder-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-left: 1px solid var(--line-soft);
  border-radius: 13px;
  margin-bottom: 7px;
}

.reminder-card.overdue { border-left-color: var(--red); }
.reminder-card.today { border-left-color: var(--gold); }
.reminder-card.soon { border-left-color: var(--green); }
.reminder-card.plan { border-left-color: var(--lav); }

.reminder-card .avatar {
  --size: 38px;
  border-radius: 11px;
}

.reminder-card .r-copy {
  flex: 1;
  min-width: 0;
}

.reminder-card .r-copy strong {
  display: block;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 850;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reminder-card .r-copy span {
  display: block;
  margin-top: 2px;
  font-size: 9.5px;
  line-height: 1.3;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reminder-card .r-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex: none;
}

.reminder-card .r-date {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.04em;
  color: var(--ink-3);
}

/* ---------- detail screen ---------- */

.detail-screen {
  padding-top: 0;
  padding-bottom: calc(34px + var(--safe-bottom));
}

.detail-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  margin: 0 -16px;
  padding: 7px 16px 8px;
  background: var(--glass-strong);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--line-soft);
}

.detail-nav .nav-title {
  flex: 1;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 档案页顶部摘要：直接复用首页 home-card 结构 */
.detail-summary {
  margin-top: 14px;
}

/* ---------- info card ---------- */

.info-card {
  padding: 14px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-radius: 21px;
}

.info-card .section-head {
  margin: 0 0 10px;
}

.field-grid {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  overflow: hidden;
  background: var(--glass-soft);
}

.field-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.field-row + .field-row {
  border-top: 1px solid var(--line-soft);
}

.field-row .field + .field {
  border-left: 1px solid var(--line-soft);
}

.field-row.single {
  grid-template-columns: minmax(0, 1fr);
}

.field-row.single .field {
  border-left: none;
}

.field {
  min-width: 0;
  min-height: 57px;
  padding: 9px 10px;
  background: transparent;
}

.field.field-empty {
  min-height: 57px;
}

.field span {
  display: block;
  margin-bottom: 4px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
  line-height: 1.2;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.field strong {
  display: block;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 750;
  word-break: break-word;
  white-space: pre-wrap;
}

.field.span-2 strong {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-2);
}

.field strong.muted {
  color: var(--ink-3);
  font-weight: 600;
}

/* ---------- record sections ---------- */

.record-section {
  margin-top: 21px;
  scroll-margin-top: 54px;
}

.module-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 2px 9px;
}

.module-head .module-icon {
  width: 33px;
  height: 33px;
  flex: none;
}

.module-head .module-icon.vaccine { background: var(--red); }
.module-head .module-icon.neuter { background: var(--green); }

.module-head .module-title {
  flex: 1;
  min-width: 0;
}

.module-head h2 {
  margin-top: 1px;
  font-size: 18px;
  line-height: 1.1;
  letter-spacing: -0.045em;
  font-weight: 850;
}

/* 月份筛选 */
.month-pick {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
}

.month-select {
  appearance: none;
  -webkit-appearance: none;
  height: 32px;
  min-height: 32px;
  padding: 0 22px 0 9px;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--glass-soft);
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: -0.01em;
  outline: none;
  cursor: pointer;
}

.month-select:focus-visible {
  border-color: var(--blue-ink);
}

.month-pick svg {
  position: absolute;
  right: 7px;
  pointer-events: none;
  color: var(--ink-3);
}

.next-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  margin-bottom: 7px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-left: 1px solid var(--line-soft);
  border-radius: 12px;
}

.next-strip.overdue { border-left-color: var(--red); }
.next-strip.today { border-left-color: var(--gold); }
.next-strip.soon { border-left-color: var(--green); }

.next-strip .ns-copy {
  flex: 1;
  min-width: 0;
}

.next-strip .ns-copy strong {
  display: block;
  font-size: 11px;
  line-height: 1.3;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.next-strip .ns-copy span {
  display: block;
  margin-top: 1px;
  color: var(--ink-3);
  font-size: 9px;
}

.record-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.swipe-shell {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
}

.swipe-delete {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 84px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: var(--red);
  color: #fff;
  /* 行改成毛玻璃后红色会从半透明行下透出来；
     用 --reveal 只显示被滑开的那一条缝。 */
  clip-path: inset(0 0 0 calc(100% - var(--reveal, 0px)));
  font-size: 10px;
  font-weight: 850;
  z-index: 0;
}

.swipe-delete:active {
  background: #8f2635;
}

.swipe-content {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  /* 背景换成照片后，实心底色会盖住照片；改用毛玻璃（红按钮由 --reveal 裁剪）。 */
  background: var(--glass-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  border-radius: 13px;
  touch-action: pan-y;
  will-change: transform;
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.swipe-content.swiping {
  transition: none;
}

.rec-date {
  width: 43px;
  flex: none;
  padding: 4px 2px;
  text-align: center;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--glass-soft);
}

.rec-date b {
  display: block;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.2;
  letter-spacing: -0.05em;
}

.rec-date span {
  display: block;
  margin-top: 1px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 7.5px;
  letter-spacing: 0.07em;
}

.rec-copy {
  flex: 1;
  min-width: 0;
}

.rec-copy .rec-title {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

.rec-copy strong {
  display: block;
  min-width: 0;
  font-size: 11.5px;
  line-height: 1.35;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rec-copy .latest-tag {
  flex: none;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--blue);
  color: var(--on-accent);
  font-family: var(--font-mono);
  font-size: 6.5px;
  letter-spacing: 0.08em;
}

.rec-copy .rec-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
  color: var(--ink-3);
  font-size: 9px;
  line-height: 1.3;
}

.rec-copy .rec-meta .sep {
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--ink-3);
}

.rec-copy .rec-next {
  display: inline-block;
  margin-top: 3px;
  padding: 2px 5px;
  border-radius: 4px;
  background: transparent;
  border: 1px solid var(--line-soft);
  color: var(--ink-3);
  font-size: 8px;
  line-height: 1.25;
}

.rec-next.overdue { background: var(--tone-overdue-bg); color: var(--tone-overdue-ink); border-color: transparent; }
.rec-next.today { background: var(--tone-today-bg); color: var(--tone-today-ink); border-color: transparent; }
.rec-next.soon { background: var(--tone-soon-bg); color: var(--tone-soon-ink); border-color: transparent; }
.rec-next.later { background: var(--tone-later-bg); color: var(--tone-later-ink); border-color: transparent; }

.rec-actions {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: none;
}

.rec-actions .icon-btn {
  width: 27px;
  height: 27px;
  border-radius: 8px;
}

.rec-actions .icon-btn.check {
  background: var(--blue);
  border-color: var(--blue-deep);
  color: var(--on-accent);
}

.rec-actions .icon-btn.check:active {
  background: var(--blue-deep);
}

/* ---------- neuter ---------- */

.neuter-card {
  padding: 13px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
}

.neuter-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.neuter-top .n-copy {
  flex: 1;
  min-width: 0;
}

.neuter-top strong {
  display: block;
  font-size: 14px;
  letter-spacing: -0.03em;
  font-weight: 850;
}

.neuter-top span {
  display: block;
  margin-top: 2px;
  color: var(--ink-3);
  font-size: 9.5px;
}

.status-badge {
  flex: none;
  padding: 4px 7px;
  border-radius: 5px;
  border: 1px solid var(--line-soft);
  background: var(--glass-soft);
  color: var(--ink-2);
  font-size: 9px;
  font-weight: 800;
}

.status-badge.done { background: var(--tone-soon-bg); color: var(--tone-soon-ink); border-color: transparent; }
.status-badge.plan { background: var(--tone-plan-bg); color: var(--tone-plan-ink); border-color: transparent; }
.status-badge.none { background: var(--tone-later-bg); color: var(--tone-later-ink); border-color: transparent; }

.neuter-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 10px;
}

.neuter-meta .nm {
  padding: 7px 8px;
  background: var(--glass-soft);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
}

.neuter-meta span {
  display: block;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 7.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.neuter-meta strong {
  display: block;
  margin-top: 2px;
  font-size: 10.5px;
  font-weight: 750;
  line-height: 1.35;
}

.neuter-notes {
  margin-top: 8px;
  padding: 8px 9px;
  border-left: 1px solid var(--line-soft);
  color: var(--ink-2);
  font-size: 10px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.danger-zone {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
}

.danger-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 100%;
  padding: 10px;
  color: var(--red);
  font-size: 11px;
  font-weight: 800;
}

/* ---------- settings ---------- */

.system-panel {
  position: relative;
  padding: 16px;
  margin: 2px 0 15px;
  background: var(--blue);
  color: var(--on-accent);
  border: 1px solid color-mix(in srgb, var(--on-accent) 22%, transparent);
  border-radius: 23px;
  overflow: hidden;
}

.system-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
    conic-gradient(rgba(255, 255, 255, 0.1) 25%, transparent 0 50%, rgba(255, 255, 255, 0.1) 0 75%, transparent 0) 0 0 / 14px 14px;
  opacity: 0.7;
  pointer-events: none;
}

.system-panel > * {
  position: relative;
  z-index: 1;
}

.system-panel .sys-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: color-mix(in srgb, var(--on-accent) 74%, transparent);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.system-panel h2 {
  margin-top: 8px;
  font-size: 26px;
  line-height: 1.05;
  letter-spacing: -0.06em;
  font-weight: 900;
}

.system-panel p {
  max-width: 280px;
  margin-top: 5px;
  color: color-mix(in srgb, var(--on-accent) 84%, transparent);
  font-size: 10px;
  line-height: 1.5;
}

.system-panel .sys-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin-top: 13px;
}

.sys-mini {
  padding: 8px;
  background: color-mix(in srgb, var(--on-accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--on-accent) 34%, transparent);
  border-radius: 8px;
}

.sys-mini span {
  display: block;
  color: color-mix(in srgb, var(--on-accent) 74%, transparent);
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.sys-mini strong {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  font-weight: 800;
}

.settings-group {
  margin-top: 19px;
}

.settings-group-title {
  margin: 0 2px 7px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.settings-card {
  overflow: hidden;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
}

.setting-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line-soft);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-row .setting-icon {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--glass-soft);
  color: var(--ink-2);
}

.setting-row .setting-copy {
  flex: 1;
  min-width: 0;
}

.setting-row strong {
  display: block;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 800;
}

.setting-row span {
  display: block;
  margin-top: 1px;
  color: var(--ink-3);
  font-size: 9px;
  line-height: 1.4;
}

.setting-row .chev {
  flex: none;
  color: var(--ink-3);
}

.setting-row.danger strong { color: var(--red); }
.setting-row.danger .setting-icon { color: var(--red); }

/* 外观：系统色 + 背景图 */
.appearance-card {
  padding: 12px;
  background: var(--glass);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
}

.appearance-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 8px;
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 800;
}

.appearance-label .hint {
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.appearance-sep {
  height: 1px;
  margin: 12px 0;
  background: var(--line-softer);
}

.swatch-row {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  justify-items: center;
  gap: 6px;
  padding: 3px 2px 5px;
}

.swatch {
  position: relative;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line-soft);
  background: var(--swatch);
}

.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--ink);
}

.swatch .swatch-tick {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #fffaf0;
  filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.55));
}

.custom-accent {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 7px;
  padding: 7px 9px;
  border: 1px solid var(--line-softer);
  border-radius: 11px;
  background: var(--glass-soft);
  cursor: pointer;
}

.custom-accent[aria-pressed="true"] {
  border-color: var(--line-soft);
  box-shadow: inset 0 0 0 1px var(--ink);
}

.custom-accent .swatch { width: 24px; height: 24px; }

.custom-accent-copy { flex: 1; min-width: 0; }

.custom-accent-copy strong {
  display: block;
  font-size: 10.5px;
  font-weight: 800;
}

.custom-accent-copy > span {
  display: block;
  margin-top: 1px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.03em;
}

.custom-accent input[type="color"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  opacity: 0;
  cursor: pointer;
}

.bg-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.bg-tile {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  min-width: 0;
  text-align: center;
}

.bg-thumb {
  position: relative;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background-color: var(--bg);
  background-size: cover;
  background-position: center;
  overflow: hidden;
}

.bg-tile[aria-pressed="true"] .bg-thumb {
  box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--ink);
}

.bg-thumb.thumb-collage { background-image: var(--bg-default-url); background-size: cover; }
.bg-thumb.thumb-plain { background-image: none; }
.bg-thumb.thumb-custom.has-img { background-image: var(--bg-custom-url); }

.bg-thumb .thumb-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink-3);
}

.bg-tile > span {
  color: var(--ink-3);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.bg-tile[aria-pressed="true"] > span { color: var(--ink); }

.veil-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 11px;
  color: var(--ink-3);
  font-size: 9px;
  font-weight: 800;
}

.veil-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--blue);
}

.veil-row .veil-value {
  min-width: 30px;
  text-align: right;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 9px;
}

.screen-footer {
  padding: 22px 0 2px;
  text-align: center;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ---------- modal / sheet ---------- */

#modal-root:empty {
  display: none;
}

.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(4, 7, 20, 0.62);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  animation: fadeIn 0.2s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  position: relative;
  width: min(430px, 100vw);
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--line-soft);
  border-radius: 27px 27px 0 0;
  animation: sheetUp 0.3s cubic-bezier(0.2, 0.85, 0.25, 1) both;
  overflow: hidden;
}

@keyframes sheetUp {
  from { transform: translateY(32px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-grab {
  width: 40px;
  height: 5px;
  flex: none;
  margin: 8px auto 0;
  border-radius: 99px;
  background: var(--line-soft);
}

.modal-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 18px 8px;
}

.modal-head .modal-copy {
  flex: 1;
  min-width: 0;
}

.modal-head h2 {
  margin-top: 2px;
  font-size: 21px;
  line-height: 1.12;
  letter-spacing: -0.055em;
  font-weight: 900;
}

.modal-head p {
  margin-top: 3px;
  color: var(--ink-3);
  font-size: 10px;
  line-height: 1.45;
}

.modal-close {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
}

.modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 2px 18px 18px;
  scrollbar-width: none;
}

.modal-body::-webkit-scrollbar {
  display: none;
}

.modal-foot {
  flex: none;
  display: flex;
  gap: 7px;
  padding: 10px 18px calc(12px + var(--safe-bottom));
  background: var(--glass-strong);
  border-top: 1px solid var(--line-soft);
}

.modal-foot .btn {
  flex: 1;
}

.modal-foot .btn.danger-auto {
  flex: 0 0 auto;
}

.btn.danger-text {
  color: var(--red);
  background: transparent;
  border-color: transparent;
}

.btn.danger-text:active {
  background: color-mix(in srgb, var(--red) 10%, transparent);
  transform: none;
}

.modal.alert {
  max-width: 340px;
  margin-bottom: 0;
  border-radius: 23px;
  animation: alertIn 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes alertIn {
  from { transform: scale(0.96); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal.alert .modal-head {
  padding-top: 18px;
}

.modal.alert .modal-body {
  overflow: visible;
  padding-bottom: 14px;
}

.alert-art {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  margin: 0 auto 10px;
  background: transparent;
  border: 1px solid var(--line-soft);
  border-radius: 14px;
  color: var(--red);
}

.modal.alert .modal-head,
.modal.alert .modal-body {
  text-align: center;
}

.modal.alert .modal-head p {
  max-width: 270px;
  margin-left: auto;
  margin-right: auto;
}

.modal.alert .modal-foot {
  border-top: 0;
  padding-top: 0;
  flex-direction: column-reverse;
}

.modal.alert .modal-foot .btn {
  flex: none;
  width: 100%;
}

.modal.alert .alert-message {
  margin: 0 auto;
  max-width: 290px;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.7;
  white-space: pre-line;
}

.modal.alert .alert-message + .alert-message {
  margin-top: 8px;
}

/* ---------- forms ---------- */

.form-section {
  margin-top: 14px;
}

.form-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 12px 1px 5px;
  color: var(--ink-2);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.form-label .micro {
  color: var(--ink-3);
}

.input,
.select,
.textarea {
  width: 100%;
  min-height: 40px;
  padding: 10px 11px;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background: var(--glass-soft);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.4;
  outline: none;
  transition: border-color 0.15s ease;
}

/* 所有日期框与文本框同宽同高 */
input.input[type="date"],
select.input[type="date"],
.input[type="date"] {
  display: block;
  width: 100%;
  height: 40px;
  min-height: 40px;
  max-height: 40px;
  padding: 0 11px;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background: transparent;
  font-size: 13px;
  line-height: 38px;
  -webkit-appearance: none;
  appearance: none;
}

.input[type="date"]:focus {
  border-color: var(--blue-ink);
}

input[type="date"]::-webkit-date-and-time-value {
  text-align: left;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  margin-left: auto;
  padding: 0;
  opacity: 0.42;
  filter: grayscale(1);
}

.form-row > div {
  min-width: 0;
}

.input:focus,
.select:focus,
.textarea:focus {
  border-color: var(--blue-ink);
}

.textarea {
  min-height: 76px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.form-row.three {
  grid-template-columns: 1.25fr 0.75fr;
}

.form-hint {
  margin: 4px 1px 0;
  color: var(--ink-3);
  font-size: 8.5px;
  line-height: 1.45;
}

.form-error {
  display: none;
  margin: 5px 1px 0;
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--tone-overdue-bg);
  color: var(--tone-overdue-ink);
  font-size: 9.5px;
  line-height: 1.4;
}

.form-error.show {
  display: block;
}

.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.choice {
  position: relative;
}

.choice input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice span {
  display: inline-block;
  padding: 7px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.2;
  font-weight: 750;
  transition: background 0.12s ease, color 0.12s ease;
}

.choice input:checked + span {
  background: var(--blue);
  border-color: var(--blue-deep);
  color: var(--on-accent);
}

.avatar-picker {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 1px 5px;
  scrollbar-width: none;
}

.avatar-picker::-webkit-scrollbar { display: none; }

.avatar-option {
  flex: none;
  padding: 3px;
  border: 1px solid transparent;
  border-radius: 15px;
  background: transparent;
}

.avatar-option .avatar {
  pointer-events: none;
}

.avatar-option.selected {
  border-color: var(--blue-ink);
  background: color-mix(in srgb, var(--blue) 9%, transparent);
}

.field-editor {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field-edit-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line-softer);
  border-radius: 0;
}

.field-edit-row:last-child {
  border-bottom: none;
}

.field-edit-row .label-input {
  flex: 0 0 auto;
  width: 4.6em;
  min-width: 0;
  min-height: 30px;
  padding: 6px 0;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--ink-3);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.01em;

  <script>
(() => {
  'use strict';

  /* =========================================================
     Constants & tiny helpers
     ========================================================= */

  const STORAGE_KEY = 'meow-system-v1';
  const APP_VERSION = '1.0.0';
  const MAX_RECORDS = 400;

  const AVATARS = ['pixel-1', 'pixel-2', 'pixel-3', '🐱', '🐈', '🐈‍⬛', '😺', '😻'];

  const DEFAULT_FIELDS = [
    { key: 'breed',   label: '品种',     type: 'text',    placeholder: '例如：布偶猫' },
    { key: 'sex',     label: '性别',     type: 'sex',     placeholder: '' },

  };

  const REMINDER_GROUP_TITLE = {
    overdue: '逾期',
    today: '今天',
    soon: '7 天内',
    later: '之后',
    plan: '待安排'
  };

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function uid(prefix = 'id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function cleanText(value) {
    return String(value ?? '').replace(/\u0000/g, '').trim();
  }

  function cleanCost(value) {
    return String(value ?? '').replace(/[^\d.,]/g, '').replace(/,/g, '').slice(0, 12);
  }

  /* =========================================================
     Dates
     ========================================================= */

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }

  function parseISO(iso) {
    if (typeof iso !== 'string') return null;
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso.slice(0, 10));
    if (!match) return null;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const date = new Date(year, month - 1, day, 12, 0, 0, 0);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
      return null;
    }
    return date;
  }

  function isoFromDate(date) {
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }

  function addDaysISO(iso, amount) {
    const date = parseISO(iso);
    if (!date) return '';
    date.setDate(date.getDate() + Number(amount || 0));
    return isoFromDate(date);
  }

  function addMonthsISO(iso, amount) {
    const date = parseISO(iso);
    if (!date) return '';
    const day = date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + Number(amount || 0));
    const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    date.setDate(Math.min(day, lastDay));
    return isoFromDate(date);
  }

  function daysBetween(fromISO, toISO) {
    const from = parseISO(fromISO);
    const to = parseISO(toISO);
    if (!from || !to) return 0;
    const a = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
    const b = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((b - a) / 86400000);
  }

  function monthsBetweenISO(fromISO, toISO) {
    const from = parseISO(fromISO);
    const to = parseISO(toISO);
    if (!from || !to) return 0;
    let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    if (to.getDate() < from.getDate()) months -= 1;
    return Math.max(0, months);
  }

  function fmtDot(iso) {
    const date = parseISO(iso);
    if (!date) return '—';
    return `${date.getFullYear()}.${pad2(date.getMonth() + 1)}.${pad2(date.getDate())}`;
  }

  function fmtShort(iso) {
    const date = parseISO(iso);
    if (!date) return '—';
    return `${pad2(date.getMonth() + 1)}.${pad2(date.getDate())}`;
  }

  function fmtDay(iso) {
    const date = parseISO(iso);
    return date ? pad2(date.getDate()) : '—';
  }

  function fmtMonth(iso) {
    const date = parseISO(iso);
    return date ? `${date.getMonth() + 1}月` : '—';
  }

  function weekdayCN(iso) {
    const date = parseISO(iso);
    if (!date) return '';
    return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()];
  }

  function dueInfo(iso) {
    if (!iso) return { tone: 'none', label: '未设置', diff: null };
    const diff = daysBetween(todayISO(), iso);
    if (diff < 0) return { tone: 'overdue', label: `逾期 ${Math.abs(diff)} 天`, diff };
    if (diff === 0) return { tone: 'today', label: '今天', diff };
    if (diff <= 7) return { tone: 'soon', label: `${diff} 天后`, diff };
    return { tone: 'later', label: `${diff} 天后`, diff };
  }

  function ageText(birthday) {
    const birth = parseISO(birthday);
    if (!birth) return '年龄未知';
    const now = new Date();
    let months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
    if (now.getDate() < birth.getDate()) months -= 1;
    if (months < 0) return '年龄未知';
    if (months < 12) return `${months} 个月`;
    const years = Math.floor(months / 12);
    const rest = months % 12;
    return rest ? `${years} 岁 ${rest} 个月` : `${years} 岁`;
  }

  function greeting() {
    const hour = new Date().getHours();
    if (hour < 5) return '凌晨好';
    if (hour < 9) return '早上好';
    if (hour < 12) return '上午好';
    if (hour < 14) return '中午好';
    if (hour < 18) return '下午好';
    return '晚上好';
  }

  /* =========================================================
     Look: 系统色 + 背景图
     ========================================================= */

  const DEFAULT_ACCENT = '#1e3bdb';
  const DEFAULT_VEIL = 0.44;
  const ACCENT_PRESETS = [
    { value: '#1e3bdb', label: '克莱因蓝' },
    { value: '#0e7d84', label: '湖水青' },
    { value: '#3f7a52', label: '苔绿' },
    { value: '#b8862b', label: '琥珀' },
    { value: '#c96a20', label: '落日橙' },
    { value: '#c2415c', label: '桃红' },
    { value: '#6b3fa0', label: '茄紫' },
    { value: '#2b3050', label: '石墨' }
  ];
  const BG_PRESETS = [
    { id: 'collage', label: '拼贴照片' },
    { id: 'plain', label: '纯色底' },
    { id: 'custom', label: '我的照片' }
  ];
  const MAX_BG_BYTES = 900 * 1024;

  function normaliseHex(value) {
    const text = String(value || '').trim().toLowerCase();
    if (/^#[0-9a-f]{6}$/.test(text)) return text;
    if (/^#[0-9a-f]{3}$/.test(text)) {
      return `#${text[1]}${text[1]}${text[2]}${text[2]}${text[3]}${text[3]}`;
    }
    return '';
  }

  function hexToRgb(hex) {
    const value = normaliseHex(hex) || DEFAULT_ACCENT;
    return {
      r: parseInt(value.slice(1, 3), 16),
      g: parseInt(value.slice(3, 5), 16),
      b: parseInt(value.slice(5, 7), 16)
    };
  }

  function rgbToHex(rgb) {
    const part = (n) => clamp(Math.round(n), 0, 255).toString(16).padStart(2, '0');
    return `#${part(rgb.r)}${part(rgb.g)}${part(rgb.b)}`;
  }

  function mixRgb(a, b, weight) {
    const t = clamp(weight, 0, 1);
    return {
      r: a.r + (b.r - a.r) * t,
      g: a.g + (b.g - a.g) * t,
      b: a.b + (b.b - a.b) * t
    };
  }

  function relativeLuminance(rgb) {
    const channel = (value) => {
      const c = value / 255;
      return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;

    return 0.2126 * channel(rgb.r) + 0.7152 * channel(rgb.g) + 0.0722 * channel(rgb.b);

  function contrastRatio(a, b) {
    const l1 = relativeLuminance(a);
    const l2 = relativeLuminance(b);
    const light = Math.max(l1, l2);
    const dark = Math.min(l1, l2);
    return (light + 0.05) / (dark + 0.05);
  }

  const PAPER_RGB = { r: 251, g: 244, b: 229 };
  const INK_RGB = { r: 23, g: 28, b: 58 };

  // 系统色上的文字：亮色用深墨，深色用米白，取对比更高的那个
  function readableOn(accentHex) {
    const accent = hexToRgb(accentHex);
    const light = contrastRatio(accent, PAPER_RGB);
    const dark = contrastRatio(accent, INK_RGB);
    return dark >= light ? '#171c3a' : '#fffaf0';
  }

  // 系统色当文字用时（卡片是浅底），压深到正文级对比（4.5:1）
  function accentForText(accentHex) {
    const accent = hexToRgb(accentHex);
    let candidate = accent;
    let step = 0;
    while (contrastRatio(candidate, PAPER_RGB) < 4.5 && step < 24) {
      candidate = mixRgb(candidate, { r: 0, g: 0, b: 0 }, 0.09);
      step += 1;
    }
    return rgbToHex(candidate);
  }

  // 下限 15%：全透明时压在照片上的大标题会糊成一片，留一点薄纱保底
  function normaliseVeil(value) {
    const num = Number(value);
    if (!Number.isFinite(num)) return DEFAULT_VEIL;
    return Math.round(clamp(num, 0.15, 0.75) * 100) / 100;
  }

  function normaliseBackground(raw) {
    const source = raw && typeof raw === 'object' ? raw : {};
    const preset = BG_PRESETS.some((item) => item.id === source.preset) ? source.preset : 'collage';
    const image = typeof source.image === 'string'
      && /^data:image\//.test(source.image)
      && source.image.length < MAX_BG_BYTES * 2
      ? source.image
      : '';
    if (preset === 'custom' && !image) {
      return { preset: 'collage', image: '', veil: normaliseVeil(source.veil) };
    }
    return { preset, image: preset === 'custom' ? image : '', veil: normaliseVeil(source.veil) };
  }

  function normaliseLook(settings) {
    const raw = settings && typeof settings === 'object' ? settings : {};
    return {
      accent: normaliseHex(raw.accent) || DEFAULT_ACCENT,
      background: normaliseBackground(raw.background)
    };
  }

  function defaultLook() {
    return normaliseLook(null);
  }

  function lookAccentLabel(accent) {
    const preset = ACCENT_PRESETS.find((item) => item.value === accent);
    return preset ? preset.label : accent.toUpperCase();
  }

  function accentSwatches(accent) {
    return ACCENT_PRESETS.map((item) => {
      const active = item.value === accent;
      return `<button type="button" class="swatch" style="--swatch:${item.value}"
        data-action="set-accent" data-accent="${item.value}"
        aria-pressed="${active}" aria-label="系统色 ${esc(item.label)}" title="${esc(item.label)}">
        ${active ? `<span class="swatch-tick">${icon('check', 15, 2.6)}</span>` : ''}
      </button>`;
    }).join('');
  }

  function customAccentRow(accent) {
    const isCustom = !ACCENT_PRESETS.some((item) => item.value === accent);
    return `<label class="custom-accent" aria-pressed="${isCustom}">
      <span class="swatch" style="--swatch:${accent}">${isCustom ? `<span class="swatch-tick">${icon('check', 15, 2.6)}</span>` : ''}</span>
      <span class="custom-accent-copy">
        <strong>自定义颜色</strong>
        <span>${isCustom ? accent.toUpperCase() : '任意取一个色，整站跟着变'}</span>
      </span>
      <input type="color" value="${accent}" data-accent-input aria-label="自定义系统色">
    </label>`;
  }

  function backgroundTiles(background) {
    return BG_PRESETS.map((item) => {
      const active = background.preset === item.id;
      const hasCustom = Boolean(background.image);
      let inner = '';
      if (item.id === 'plain') {
        inner = `<span class="thumb-empty">${icon('close', 16)}</span>`;
      } else if (item.id === 'custom' && !hasCustom) {
        inner = `<span class="thumb-empty">${icon('upload', 16)}</span>`;
      }
      const thumbClass = item.id === 'custom' && hasCustom ? ` bg-thumb thumb-custom has-img` : ` bg-thumb thumb-${item.id}`;
      return `<button type="button" class="bg-tile" data-action="set-background" data-preset="${item.id}"
        aria-pressed="${active}" aria-label="背景 ${esc(item.label)}">
        <span class="${thumbClass.trim()}">${inner}</span>
        <span>${item.label}</span>
      </button>`;
    }).join('');
  }

  function escapeCssUrl(value) {
    return String(value).replace(/["\\\n\r]/g, '');
  }

  function applyLook() {
    const root = document.documentElement;
    const look = normaliseLook(store.settings);
    const accent = look.accent;
    const accentRgb = hexToRgb(accent);

    root.style.setProperty('--blue', accent);
    root.style.setProperty('--blue-2', rgbToHex(mixRgb(accentRgb, { r: 255, g: 255, b: 255 }, 0.32)));
    root.style.setProperty('--blue-deep', rgbToHex(mixRgb(accentRgb, { r: 0, g: 0, b: 0 }, 0.45)));
    root.style.setProperty('--blue-ink', accentForText(accent));
    root.style.setProperty('--on-accent', readableOn(accent));

    const background = look.background;
    const photo = background.preset === 'custom' && background.image
      ? `url("${escapeCssUrl(background.image)}")`
      : background.preset === 'plain'
        ? 'none'
        : 'var(--bg-default-url)';
    root.style.setProperty('--bg-photo-url', photo);
    root.style.setProperty('--bg-custom-url', background.image ? `url("${escapeCssUrl(background.image)}")` : 'none');

    const veil = background.preset === 'plain' ? 0 : background.veil;
    root.style.setProperty('--photo-veil', `rgba(241, 231, 213, ${veil})`);
    root.style.setProperty('--photo-blur', background.preset === 'custom' ? '3px' : '2px');

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', accent);
  }

  function normaliseField(field, index) {

      id: String((field && field.id) || uid('field')),
      key: String((field && field.key) || `custom_${uid('key')}`),
      label: cleanText(field && field.label) || `字段 ${index + 1}`,
      value: field && field.value != null ? String(field.value) : '',
      type,
      placeholder: cleanText(field && field.placeholder)
    };
  }

  function normaliseFields(fields) {
    if (!Array.isArray(fields)) return defaultFields();
    return fields
      .map(normaliseField)
      .filter((field) => !(field.key === 'chip' && !field.value.trim()));
  }

  function normaliseRecord(record) {
    const date = parseISO(record && record.date) ? record.date : '';
    const nextDate = parseISO(record && record.nextDate) ? record.nextDate : '';
    const interval = Number.parseInt(record && record.intervalMonths, 10);
    return {
      id: String((record && record.id) || uid('rec')),
      kind: cleanText(record && record.kind) || '其他',
      date,
      product: cleanText(record && record.product),
      dose: cleanText(record && record.dose),
      batch: cleanText(record && record.batch),
      hospital: cleanText(record && record.hospital),
      cost: cleanCost(record && record.cost),
      intervalMonths: Number.isFinite(interval) ? clamp(interval, 0, 120) : 0,
      nextDate,
      notes: cleanText(record && record.notes),
      createdAt: Number(record && record.createdAt) || Date.now()
    };
  }

    if (!neuter || typeof neuter !== 'object') return null;
    const status = ['未绝育', '计划中', '已绝育'].includes(neuter.status) ? neuter.status : '未绝育';
    return {
      status,
      date: parseISO(neuter.date) ? neuter.date : '',
      hospital: cleanText(neuter.hospital),
      cost: cleanCost(neuter.cost),
      precheck: Boolean(neuter.precheck),
      notes: cleanText(neuter.notes)
