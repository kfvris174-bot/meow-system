  <div class="scene" aria-hidden="true">
    <div class="scene-rainbow"></div>
    <div class="scene-rainbow second"></div>
    <div class="scene-star s1"></div>
    <div class="scene-star s2"></div>
    <div class="scene-star s3"></div>
    <div class="scene-star s4"></div>
    <div class="scene-note">CAT CARE INTERFACE / V1.0</div>
    <div class="scene-bubble"><small>MEOW SYSTEM</small>今天要照顾<br>哪只小猫？</div>
    <div class="scene-cat" data-scene-cat></div>
    <div class="scene-system">
      <div class="sys-top"><span>SYSTEM / 01</span><span>● REC</span></div>

        <div class="sb-right">

          <span class="sb-battery"><i></i></span>

      </div>
      <div class="rainbow-rule" aria-hidden="true"></div>
      <div id="app"></div>
      <div class="toast-wrap" id="toast-wrap" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <input id="import-file" type="file" accept="application/json,.json" class="sr-only" tabindex="-1">
  <input id="bg-file" type="file" accept="image/*" class="sr-only" tabindex="-1">
